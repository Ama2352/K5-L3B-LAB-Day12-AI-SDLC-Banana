<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Út Sen</title>
<style>
  :root {
    --bg: #0c141c;
    --panel: rgba(14, 24, 34, 0.78);
    --panel-border: rgba(255, 255, 255, 0.14);
    --text: #eef4f8;
    --muted: #9eb3c2;
    --accent: #4fc3f7;
    --warm: #ffb74d;
    --danger: #ef5350;
    --good: #66bb6a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hud-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 14px;
  }
  .hud-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hud-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 8px 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
  }
  .mode-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.2px;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 18px;
    min-width: 72px;
    text-align: center;
  }
  .timer.low {
    color: var(--danger);
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.55; }
  }
  .bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bar-track {
    width: 170px;
    height: 16px;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #29b6f6, #4fc3f7);
    transition: width 0.08s linear;
  }
  .bar-fill.low {
    background: linear-gradient(90deg, #e53935, #ff7043);
  }
  .bar-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
  }
  .hearts {
    font-size: 19px;
    letter-spacing: 2px;
    color: #ff6b81;
    line-height: 1;
  }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .stat-pill small {
    color: var(--muted);
    font-weight: 500;
  }
  .hud-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .btn {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 6px 11px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.18); }
  .btn:active { transform: scale(0.96); }
  .hud-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .slots {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .slot {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .slot.filled {
    border-color: rgba(255, 255, 255, 0.45);
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.25);
  }
  .subtext {
    font-size: 12px;
    color: var(--muted);
  }
  .stock-list {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 12px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }
  .events-box {
    max-width: 340px;
    text-align: right;
    font-size: 11px;
    color: rgba(232, 238, 242, 0.82);
  }
  .events-box div {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .controls-hint {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .banner {
    position: fixed;
    top: 66px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(183, 28, 28, 0.92);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    display: none;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 12, 18, 0.65);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .modal {
    background: #13202c;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    padding: 22px 26px;
    min-width: 320px;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  }
  .modal h2 { margin: 0 0 8px; font-size: 20px; }
  .modal p { margin: 0 0 16px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud-layer">
  <div class="hud-top">
    <div class="hud-group">
      <div class="panel mode-badge" id="hud-mode">☀️ Buổi sáng</div>
      <div class="panel timer" id="hud-timer">--:--</div>

      <!-- HUD Gather -->
      <div class="panel bar-wrap" id="hud-oxy-wrap">
        <div class="bar-track">
          <div class="bar-fill" id="hud-oxy-fill"></div>
          <div class="bar-label" id="hud-oxy-label">Oxy --s</div>
        </div>
        <div class="hearts" id="hud-hearts"></div>
      </div>
      <div class="panel stat-pill" id="hud-gather-meta">
        <span id="hud-pos">x 0.0 · d 0.0</span>
        <small id="hud-surface"></small>
        <small id="hud-cd"></small>
      </div>

      <!-- HUD Quán -->
      <div class="panel stat-pill hidden" id="hud-quan-stats">
        <span id="hud-money">💰 0k</span>
        <span>·</span>
        <span id="hud-rep">⭐ 3.0</span>
        <span>·</span>
        <span id="hud-score">🏆 0</span>
        <span>·</span>
        <span id="hud-hand"><small>Tay không</small></span>
      </div>
    </div>

    <div class="hud-actions">
      <button class="btn" id="btn-sound" type="button">🔊 Âm thanh: Bật</button>
      <button class="btn" id="btn-restart" type="button">↻ Chơi lại (R)</button>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="panel" id="hud-bottom-left">
      <div class="slots hidden" id="hud-hold-slots"></div>
      <div class="stock-list hidden" id="hud-stock-list"></div>
      <div class="subtext" id="hud-bottom-summary">Đang kết nối…</div>
    </div>

    <div class="panel events-box">
      <div id="hud-events"></div>
      <div class="controls-hint" id="hud-controls">WASD / Mũi tên: di chuyển · E: tương tác · Space: bắt cá · R: chơi lại</div>
    </div>
  </div>
</div>

<div class="banner" id="hud-banner"></div>

<div class="modal-backdrop" id="hud-modal">
  <div class="modal">
    <h2 id="modal-title">Kết thúc buổi</h2>
    <p id="modal-reason"></p>
    <button class="btn" id="modal-restart" type="button">↻ Chơi lại (R)</button>
  </div>
</div>

<script>
"use strict";
/*
 * Client chơi trực tiếp cho Quán Ăn Chợ Nổi.
 * CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua an toàn.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

let snap = null;
let offline = false;
let soundEnabled = true;
let audioCtx = null;

// Theo dõi sự kiện để tạo popup & âm thanh phản hồi (chỉ kích hoạt 1 lần mỗi event)
let lastSeenTick = -1;
let seenEventKeys = new Set();
const popups = [];
const bubbles = [];

// ---------- Âm thanh tổng hợp nhẹ bằng WebAudio (không cần asset ngoài) ----------
function ensureAudio() {
  if (!soundEnabled) return null;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}
function playTone(freq, dur = 0.1, type = "sine", vol = 0.08, slideTo = null) {
  const ac = ensureAudio();
  if (!ac) return;
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(now);
  osc.stop(now + dur);
}

// ---------- Vào: phím & nút ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy; // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function doRestart() {
  fetch("/restart", { method: "POST" }).catch(() => {});
  lastSent = "";
  down.clear();
  lastSeenTick = -1;
  seenEventKeys.clear();
  popups.length = 0;
}
function keyName(e) { return e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  ensureAudio();
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { doRestart(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

document.getElementById("btn-restart").addEventListener("click", doRestart);
document.getElementById("modal-restart").addEventListener("click", doRestart);
document.getElementById("btn-sound").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  document.getElementById("btn-sound").textContent = soundEnabled ? "🔊 Âm thanh: Bật" : "🔇 Âm thanh: Tắt";
  if (soundEnabled) ensureAudio();
});

// ---------- Ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const next = await r.json();
    if (snap && next.tick < snap.tick) {
      lastSeenTick = -1;
      seenEventKeys.clear();
      popups.length = 0;
    }
    snap = next;
    offline = false;
    processNewEvents();
    updateHudDom();
  } catch (e) {
    offline = true;
    updateHudDom();
  }
  setTimeout(poll, 16);
}
poll();

// ---------- Từ điển hiển thị ----------
const KIND_COLOR = {
  ca_loc: "#7c9a52",
  ca_linh: "#b8dcf2",
  ca_keo: "#d9a066",
  bong_dien_dien: "#f2c230",
  bong_sung: "#e8799c",
  keo_neo: "#8fcf6b"
};
const KIND_NAME = {
  ca_loc: "Cá lóc",
  ca_linh: "Cá linh",
  ca_keo: "Cá kèo",
  bong_dien_dien: "Điên điển",
  bong_sung: "Bông súng",
  keo_neo: "Kèo nèo"
};
const KIND_ICON = {
  ca_loc: "🐟",
  ca_linh: "🐠",
  ca_keo: "🐡",
  bong_dien_dien: "🌼",
  bong_sung: "🪷",
  keo_neo: "🌿"
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển"
};
const REASON_NAME = {
  docked: "Đã cập bến an toàn!",
  time: "Hết giờ làm việc!",
  fainted: "Út Sen bị ngất vì hết máu!",
  error: "Mô phỏng gặp lỗi."
};
const kc = (k) => KIND_COLOR[k] || "#b0bec5";

function fmtTime(ticks) {
  if (ticks === undefined || ticks === null) return "--:--";
  const s = Math.max(0, Math.ceil(ticks / 60));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try {
    const s = JSON.stringify(d);
    return s.length > 48 ? s.slice(0, 45) + "…" : s;
  } catch (e) {
    return "";
  }
}

// ---------- Xử lý phản hồi từ events ----------
function addPopup(msg, color = "#ffffff", worldPos = null) {
  popups.push({ msg, color, worldPos, life: 65, maxLife: 65 });
}
function processNewEvents() {
  if (!snap || !Array.isArray(snap.events)) return;
  if (lastSeenTick < 0) {
    // Lần đầu sync: đánh dấu sự kiện cũ để tránh kêu âm thanh dồn
    snap.events.forEach((ev, idx) => seenEventKeys.add(`${ev.tick}:${ev.name}:${idx}`));
    lastSeenTick = snap.tick || 0;
    return;
  }
  snap.events.forEach((ev, idx) => {
    const key = `${ev.tick}:${ev.name}:${JSON.stringify(ev.data || {})}`;
    if (seenEventKeys.has(key)) return;
    seenEventKeys.add(key);
    if (seenEventKeys.size > 200) {
      const first = seenEventKeys.values().next().value;
      seenEventKeys.delete(first);
    }
    const pPos = snap.player && snap.player.pos ? [...snap.player.pos] : null;
    switch (ev.name) {
      case "gather":
        playTone(520, 0.12, "triangle", 0.08, 760);
        addPopup("+1 " + (KIND_NAME[ev.data?.kind] || "rau"), "#ffe082", pPos);
        break;
      case "fish_caught":
        playTone(440, 0.14, "sine", 0.09, 880);
        addPopup("Bắt được " + (KIND_NAME[ev.data?.kind] || "cá") + "!", "#81d4fa", pPos);
        break;
      case "hold_full":
        playTone(220, 0.15, "sawtooth", 0.06, 160);
        addPopup("Giỏ đã đầy!", "#ffab91", pPos);
        break;
      case "choke":
        playTone(170, 0.2, "square", 0.07, 110);
        addPopup("Ngạt thở! -1 Máu", "#ef5350", pPos);
        break;
      case "dive":
        playTone(300, 0.09, "sine", 0.05, 190);
        break;
      case "surface":
        playTone(240, 0.09, "sine", 0.05, 380);
        break;
      case "cook_started":
        playTone(360, 0.1, "triangle", 0.06, 480);
        addPopup("Đang nấu…", "#ffcc80", pPos);
        break;
      case "dish_ready":
        playTone(660, 0.16, "triangle", 0.08, 990);
        addPopup("Món chín rồi!", "#a5d6a7", pPos);
        break;
      case "served":
        playTone(580, 0.12, "sine", 0.08, 780);
        addPopup("Đã phục vụ!", "#b3e5fc", pPos);
        break;
      case "paid":
        playTone(740, 0.14, "sine", 0.09, 1040);
        addPopup(`+${ev.data?.amount ?? ""}k`, "#ffd54f", pPos);
        break;
      case "customer_left":
        playTone(210, 0.22, "sawtooth", 0.06, 140);
        addPopup("Khách bỏ đi!", "#ef9a9a", pPos);
        break;
      case "gather_end":
      case "quan_end":
        playTone(523, 0.2, "triangle", 0.08, 659);
        break;
    }
  });
  lastSeenTick = snap.tick || 0;
}

// ---------- Cập nhật HUD DOM ----------
function updateHudDom() {
  const banner = document.getElementById("hud-banner");
  if (offline) {
    banner.textContent = "Mất kết nối tới máy chủ (đã tắt chưa?)";
    banner.style.display = "block";
  } else if (snap && snap.error) {
    banner.textContent = "Luật của nhóm báo lỗi — xem terminal. Nhấn R để chơi lại.";
    banner.style.display = "block";
  } else {
    banner.style.display = "none";
  }

  if (!snap) return;

  const isQuan = snap.mode === "quan";
  document.getElementById("hud-mode").textContent = isQuan ? "🏮 Buổi tối · Mở Quán" : "☀️ Buổi sáng · Lặn & Hái";

  const timerEl = document.getElementById("hud-timer");
  timerEl.textContent = "⏱ " + fmtTime(snap.time_left_ticks);
  timerEl.classList.toggle("low", snap.time_left_ticks !== undefined && snap.time_left_ticks <= 20 * 60);

  // Bật/tắt nhóm HUD theo màn chơi
  document.getElementById("hud-oxy-wrap").classList.toggle("hidden", isQuan);
  document.getElementById("hud-gather-meta").classList.toggle("hidden", isQuan);
  document.getElementById("hud-quan-stats").classList.toggle("hidden", !isQuan);
  document.getElementById("hud-hold-slots").classList.toggle("hidden", isQuan);
  document.getElementById("hud-stock-list").classList.toggle("hidden", !isQuan);

  document.getElementById("hud-controls").textContent = isQuan
    ? "WASD / Mũi tên: đi lại · E: tương tác (bếp / bàn) · R: chơi lại"
    : "WASD / Mũi tên: bơi · E: hái / cập bến · Space: bắt cá · R: chơi lại";

  const p = snap.player || {};
  if (!isQuan) {
    const oxy = p.oxygen_ticks ?? 0;
    const oxyMax = p.oxygen_max_ticks || 1;
    const frac = Math.max(0, Math.min(1, oxy / oxyMax));
    const fill = document.getElementById("hud-oxy-fill");
    fill.style.width = (frac * 100).toFixed(1) + "%";
    fill.classList.toggle("low", frac < 0.25);
    document.getElementById("hud-oxy-label").textContent = "Oxy " + Math.ceil(oxy / 60) + "s";

    let hearts = "";
    const hpMax = p.hp_max || 0;
    const hp = p.hp ?? 0;
    for (let i = 0; i < hpMax; i++) hearts += i < hp ? "♥" : "♡";
    document.getElementById("hud-hearts").textContent = hearts;

    if (p.pos) {
      document.getElementById("hud-pos").textContent = `x ${p.pos[0].toFixed(1)} · d ${p.pos[1].toFixed(1)}`;
    }
    const atSurf = p.at_surface === undefined ? (p.pos ? p.pos[1] <= 0.5 : true) : p.at_surface;
    document.getElementById("hud-surface").textContent = atSurf ? "· Mặt nước" : "· Đang lặn";
    document.getElementById("hud-cd").textContent = p.catch_cd_ticks > 0 ? `· Hồi chiêu ${(p.catch_cd_ticks / 60).toFixed(1)}s` : "";

    // Giỏ (hold)
    const slotsEl = document.getElementById("hud-hold-slots");
    const cap = snap.hold_capacity || 0;
    const hold = snap.hold || [];
    let html = "";
    for (let i = 0; i < cap; i++) {
      const k = hold[i];
      if (k) {
        html += `<div class="slot filled" style="background:${kc(k)};color:#102027" title="${KIND_NAME[k] || k}">${KIND_ICON[k] || "•"}</div>`;
      } else {
        html += `<div class="slot"></div>`;
      }
    }
    slotsEl.innerHTML = html;
    const counts = {};
    hold.forEach((k) => (counts[k] = (counts[k] || 0) + 1));
    const summary = Object.keys(counts).map((k) => `${KIND_NAME[k] || k} ×${counts[k]}`).join(", ");
    document.getElementById("hud-bottom-summary").textContent = `Giỏ ${hold.length}/${cap}${summary ? " — " + summary : " (trống)"}`;
  } else {
    document.getElementById("hud-money").textContent = `💰 ${snap.money ?? 0}k`;
    document.getElementById("hud-rep").textContent = `⭐ ${(snap.reputation ?? 0).toFixed(1)}`;
    document.getElementById("hud-score").textContent = `🏆 ${snap.score ?? 0}`;
    const handEl = document.getElementById("hud-hand");
    if (snap.hand) {
      const dish = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      handEl.innerHTML = `🍲 <strong>${DISH_NAME[dish] || dish}</strong>`;
    } else {
      handEl.innerHTML = `<small>Tay không</small>`;
    }

    const stockEl = document.getElementById("hud-stock-list");
    const stock = snap.stock || {};
    const keys = Object.keys(stock).filter((k) => stock[k] > 0);
    stockEl.innerHTML = keys.length
      ? keys.map((k) => `<span class="chip"><span class="dot" style="background:${kc(k)}"></span>${KIND_NAME[k] || k} ×${stock[k]}</span>`).join("")
      : `<span class="subtext">Kho nguyên liệu trống</span>`;
    document.getElementById("hud-bottom-summary").textContent = keys.length ? "Kho nguyên liệu sẵn sàng nấu" : "Chưa có nguyên liệu trong kho";
  }

  // Nhật ký sự kiện
  const evBox = document.getElementById("hud-events");
  const recent = (snap.events || []).slice(-4);
  evBox.innerHTML = recent.map((e) => `<div>t${e.tick} · <b>${e.name}</b> ${brief(e.data)}</div>`).join("");

  // Modal kết thúc
  const modal = document.getElementById("hud-modal");
  if (snap.finished) {
    modal.style.display = "flex";
    document.getElementById("modal-title").textContent = isQuan ? "Kết thúc ca tối" : "Kết thúc buổi sáng";
    document.getElementById("modal-reason").textContent = REASON_NAME[snap.reason] || (snap.reason || "Đã hoàn thành.");
  } else {
    modal.style.display = "none";
  }
}

// ---------- Hỗ trợ vẽ Canvas ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "700 " : "") + (o.size || 13) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.45)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function dist(a, b) {
  return Math.hypot((a[0] || 0) - (b[0] || 0), (a[1] || 0) - (b[1] || 0));
}

// ---------- Cảnh GATHER: nhìn ngang ----------
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6.5;
  const top = 74, bottom = 78;
  const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const t = (snap.tick || 0) / 60;

  // Bầu trời
  const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
  skyGrad.addColorStop(0, "#9ad8f0");
  skyGrad.addColorStop(1, "#dff4fc");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, top, w, SKY * s);

  // Mây nhẹ
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 28 + t * 0.8) % (X + 12)) - 6;
    const cy = -4.2 + (i % 2) * 1.1;
    ctx.beginPath();
    ctx.ellipse(sx(cx), sy(cy), 3.2 * s, 0.9 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Nước sông
  const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  waterGrad.addColorStop(0, "#41a8d6");
  waterGrad.addColorStop(0.45, "#196791");
  waterGrad.addColorStop(1, "#072038");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  // Đáy sông
  ctx.fillStyle = "#2b241c";
  ctx.fillRect(sx(0), sy(D) - 0.5 * s, X * s, 0.7 * s);

  // Sóng mặt nước
  ctx.strokeStyle = "#e8f8ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= X; x += 1) {
    const wave = Math.sin(x * 0.55 + t * 3) * 0.14;
    if (x === 0) ctx.moveTo(sx(x), sy(wave));
    else ctx.lineTo(sx(x), sy(wave));
  }
  ctx.stroke();

  // Vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.09)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(d));
    ctx.lineTo(sx(X), sy(d));
    ctx.stroke();
    text(d + " m", sx(0) + 6, sy(d) - 3, { size: 10, color: "rgba(255,255,255,.45)" });
  }

  const p = snap.player;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface) : false;

  // Bến thuyền
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const nearDock = p && dist(p.pos, dp) <= dr;
  ctx.fillStyle = "#7a5838";
  ctx.fillRect(sx(dp[0] - 1.6), sy(-0.8), 3.2 * s, 1.0 * s);
  ctx.fillStyle = "#b84a39";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.0), sy(-0.8));
  ctx.lineTo(sx(dp[0]), sy(-2.6));
  ctx.lineTo(sx(dp[0] + 2.0), sy(-0.8));
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = nearDock ? "#ffe082" : "rgba(255,230,150,.55)";
  ctx.lineWidth = nearDock ? 2.5 : 1.5;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  text(nearDock ? "Bến · Nhấn [E] cập bến" : "Bến (E)", sx(dp[0]), sy(-3.0), {
    size: 11, bold: nearDock, align: "center", color: nearDock ? "#4a2511" : "#5a3a22"
  });

  // Nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const inRange = p && !underwater && ready && meta.interact_radius && dist(p.pos, n.pos) <= meta.interact_radius;
    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.35;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    // Lá/đế nổi
    ctx.fillStyle = "#4d8c4a";
    ctx.beginPath();
    ctx.ellipse(nx, ny, 1.0 * s, 0.32 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Bông
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath();
    ctx.arc(nx, ny - 0.35 * s, 0.48 * s, 0, Math.PI * 2);
    ctx.fill();
    if (inRange) {
      ctx.strokeStyle = "#fff59d";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(nx, ny - 0.2 * s, 1.15 * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
    text(inRange ? `[E] ${KIND_NAME[n.kind] || n.id}` : n.id, nx, ny - 1.0 * s, {
      size: 10, bold: inRange, align: "center", color: inRange ? "#1b3a1a" : "#234"
    });
    if (!ready && n.regrow_ticks) {
      text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.15 * s, { size: 10, align: "center", color: "#fff" });
    }
  });

  // Đàn cá
  (snap.fish || []).forEach((f) => {
    const inCatch = p && underwater && meta.catch_radius && dist(p.pos, f.pos) <= meta.catch_radius;
    const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    // Thân cá
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.95 * s, 0.45 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Đuôi cá
    ctx.beginPath();
    ctx.moveTo(-0.85 * s, 0);
    ctx.lineTo(-1.45 * s, -0.45 * s);
    ctx.lineTo(-1.45 * s, 0.45 * s);
    ctx.closePath();
    ctx.fill();
    // Mắt cá
    ctx.fillStyle = "#102027";
    ctx.beginPath();
    ctx.arc(0.45 * s, -0.1 * s, 0.1 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (inCatch) {
      ctx.strokeStyle = "#80deea";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(fx, fy, 1.2 * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    text(inCatch ? `[Space] ${KIND_NAME[f.kind] || f.id}` : f.id, fx, fy - 0.8 * s, {
      size: 10, bold: inCatch, align: "center", color: inCatch ? "#e0f7fa" : "rgba(255,255,255,.8)"
    });
  });

  // Bong bóng khi lặn
  if (p && underwater && (snap.tick || 0) % 14 === 0) {
    bubbles.push({ x: p.pos[0], d: p.pos[1] - 0.4, r: 0.15 + Math.random() * 0.15, life: 45 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const bb = bubbles[i];
    bb.d -= 0.08;
    bb.life -= 1;
    if (bb.life <= 0 || bb.d <= 0) { bubbles.splice(i, 1); continue; }
    ctx.strokeStyle = "rgba(225, 245, 254, 0.55)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(sx(bb.x), sy(bb.d), bb.r * s, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Người chơi (Út Sen)
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = "rgba(128, 222, 234, 0.28)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = "rgba(255, 245, 157, 0.35)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a);
      // Thân
      ctx.fillStyle = "#ff8a3d";
      ctx.beginPath();
      ctx.arc(0, 0, 0.62 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Kính lặn / hướng nhìn
      ctx.fillStyle = underwater ? "#80deea" : "#ffe0b2";
      ctx.beginPath();
      ctx.arc(0.35 * s, 0, 0.24 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawPopups(sx, sy);
}

// ---------- Cảnh QUÁN: nhìn từ trên xuống ----------
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 74, bottom = 78;
  const s = Math.max(1, Math.min((w - 48) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top + (h - top - bottom - s * Z) / 2;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // Nước sông ban đêm xung quanh quán
  ctx.fillStyle = "#091926";
  ctx.fillRect(0, top, w, h - top - bottom);

  // Sàn gỗ quán ăn
  ctx.fillStyle = "#b88b58";
  ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "rgba(70, 42, 18, 0.25)";
  ctx.lineWidth = 1;
  for (let gx = 1; gx < X; gx += 1) {
    ctx.beginPath();
    ctx.moveTo(sx(gx), sy(Z));
    ctx.lineTo(sx(gx), sy(0));
    ctx.stroke();
  }
  ctx.strokeStyle = "#5c3b1e";
  ctx.lineWidth = 5;
  ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  const p = snap.player;

  // Bếp
  (snap.stoves || []).forEach((st) => {
    const stX = sx(st.pos[0]), stY = sy(st.pos[1]);
    const near = p && meta.interact_radius && dist(p.pos, st.pos) <= meta.interact_radius;
    const col = st.state === "cooking" ? "#e67e22" : st.state === "ready" ? "#66bb6a" : "#61686e";
    ctx.fillStyle = col;
    ctx.fillRect(stX - 0.85 * s, stY - 0.85 * s, 1.7 * s, 1.7 * s);
    ctx.strokeStyle = near ? "#fff59d" : "#2d241c";
    ctx.lineWidth = near ? 3 : 2;
    ctx.strokeRect(stX - 0.85 * s, stY - 0.85 * s, 1.7 * s, 1.7 * s);

    text(st.id, stX, stY + 4, { size: 12, bold: true, align: "center", color: "#111" });
    if (st.dish) {
      text(DISH_NAME[st.dish] || st.dish, stX, stY - 1.05 * s, { size: 10, bold: true, align: "center", color: "#2a1606" });
    }
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      text(Math.ceil(st.cook_ticks_left / 60) + "s", stX, stY + 1.3 * s, { size: 11, bold: true, align: "center", color: "#2a1606" });
    } else if (st.state === "ready") {
      text("[E] Lấy món", stX, stY + 1.3 * s, { size: 10, bold: true, align: "center", color: "#1b5e20" });
    }
  });

  // Bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const near = p && meta.interact_radius && dist(p.pos, tb.pos) <= meta.interact_radius;
    ctx.fillStyle = "#7d4e24";
    ctx.beginPath();
    ctx.arc(tx, ty, 0.92 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = near ? "#fff59d" : "#4a2c11";
    ctx.lineWidth = near ? 3 : 2;
    ctx.stroke();
    text(tb.id, tx, ty + 4, { size: 12, bold: true, align: "center", color: "#fff" });

    const c = byTable[tb.id];
    if (c) {
      const cx = tx, cy = ty - 1.55 * s;
      ctx.fillStyle = c.state === "eating" ? "#81c784" : "#f48fb1";
      ctx.beginPath();
      ctx.arc(cx, cy, 0.56 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      text(DISH_NAME[c.dish_id] || c.dish_id || "?", cx, cy - 0.8 * s, { size: 10, bold: true, align: "center", color: "#2a1606" });
      if (c.patience_ticks_left !== undefined) {
        const frac = c.patience_ticks_left / patMax;
        const pCol = frac > 0.5 ? "#66bb6a" : frac > 0.25 ? "#ffb74d" : "#ef5350";
        bar(cx - 0.85 * s, cy + 0.68 * s, 1.7 * s, 6, frac, pCol);
      }
    }
  });

  // Người chơi
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255, 255, 255, .45)";
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = "#ff8a3d";
    ctx.beginPath();
    ctx.arc(px, py, 0.52 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.8;
    ctx.stroke();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + (DISH_NAME[hand] || hand), px, py - 0.85 * s, { size: 11, bold: true, align: "center", color: "#2a1606" });
    }
  }

  drawPopups(sx, sy);
}

function drawPopups(sx, sy) {
  for (let i = popups.length - 1; i >= 0; i--) {
    const pp = popups[i];
    pp.life -= 1;
    if (pp.life <= 0) { popups.splice(i, 1); continue; }
    const alpha = Math.min(1, pp.life / 20);
    const rise = (pp.maxLife - pp.life) * 0.6;
    const x = pp.worldPos ? sx(pp.worldPos[0]) : innerWidth / 2;
    const y = (pp.worldPos ? sy(pp.worldPos[1]) : innerHeight / 2) - 24 - rise;
    ctx.save();
    ctx.globalAlpha = alpha;
    text(pp.msg, x, y, { size: 14, bold: true, align: "center", color: pp.color });
    ctx.restore();
  }
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#0c141c";
  ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h);
    else drawGather(w, h);
  }
}
requestAnimationFrame(frame);
</script>
</body>
